version: 2

# One pull request a month, on the 15th, with everything in it. Nothing here runs in the
# browser except Astro's own output, so there's no rush: a monthly sweep keeps the build
# current without a stream of notifications during homework season.
multi-ecosystem-groups:
  monthly-dependencies:
    schedule:
      interval: "cron"
      cronjob: "0 9 15 * *"
      timezone: "America/Chicago"

updates:
  - package-ecosystem: "npm"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "monthly-dependencies"
    ignore:
      # The type check in `npm run build` (@astrojs/check) only supports TypeScript 5 and 6, so a
      # jump to 7 breaks `npm ci` and the deploy. Drop this once @astrojs/check supports 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "monthly-dependencies"
